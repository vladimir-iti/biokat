<!--
  Фавикон: тот же знак, что и в шапке, но перерисованный под мелкий размер.
  В логотипе линии толщиной в одну единицу — на 16 пикселях от них ничего
  не осталось бы, поэтому здесь пропорции огрублены: линия, узел и засечки
  утолщены, а знак вписан с отступом, чтобы пережить круглую обрезку,
  которую делает поиск. Заливка фирменная, знак вывернут в светлый.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#0f7a8e" />
  <g fill="#f2f4f4">
    <rect x="28.5" y="8" width="7" height="48" />
    <rect x="8" y="28.5" width="48" height="7" />
    <rect x="22" y="22" width="20" height="20" />
    <rect x="22" y="8" width="20" height="6" />
    <rect x="22" y="50" width="20" height="6" />
    <rect x="8" y="22" width="6" height="20" />
    <rect x="50" y="22" width="6" height="20" />
  </g>
</svg>
